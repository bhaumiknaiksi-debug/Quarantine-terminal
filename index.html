<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EDGE V6 // Quant Signals</title>
    
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/theme.css">
    <link rel="stylesheet" href="./css/mobile.css">
    <link rel="stylesheet" href="./css/desktop.css">
    <link rel="stylesheet" href="./css/animations.css">
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-shell" class="app-layout-wrapper">
        
        <header id="global-telemetry-header" class="telemetry-header">
            <div class="system-branding">
                <span class="brand-matrix">EDGE</span>
                <span class="brand-version">V6.2.0</span>
            </div>
            <div class="engine-performance-telemetry">
                <div class="telemetry-metric">
                    <span class="telemetry-label">FPS</span>
                    <span class="telemetry-value text-mono" id="telemetry-fps">120</span>
                </div>
                <div class="telemetry-metric">
                    <span class="telemetry-label">WS</span>
                    <span class="telemetry-status-badge status-disconnected" id="telemetry-ws">DISCONNECTED</span>
                </div>
            </div>
        </header>

        <main id="workspace-container" class="workspace-grid" data-active-view="home">
            
            <div id="view-home" class="workspace-view active">
                
                <div class="workspace-column layout-primary">
                    <div id="command-center-root"></div>
                    <div id="capital-card-root"></div>
                </div>

                <div class="workspace-column layout-secondary">
                    <div id="alpha-hot-list-root"></div>
                    <div id="journal-card-root"></div>
                </div>

                <div class="workspace-column layout-tertiary">
                    <div id="market-regime-card-root"></div>
                    <div id="risk-radar-card-root"></div>
                </div>
                
            </div>
        </main>
        
        <div id="notification-center-root" class="notification-overlay-layer"></div>
    </div>

    <script type="module" src="./js/bootstrap.js"></script>
</body>
</html>
